spring.application.name=agrideep-backend

# The frontend calls http://localhost:8000 by default (VITE_API_BASE_URL).
server.port=8000

# PostgreSQL with PostGIS. The defaults match the db service in docker-compose.yml, so running
# from source only needs `docker compose up -d db`. Override them with SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/agrideep
spring.datasource.username=agrideep
spring.datasource.password=agrideep
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# schema.sql enables PostGIS and upgrades parcels saved before it; it runs before Hibernate.
# It contains a DO block, so it is sent whole instead of being split at each semicolon.
spring.sql.init.mode=always
spring.sql.init.separator=^^^ END OF SCRIPT ^^^

# Browser origins allowed to call the API: Vite dev server and Vite preview.
# Override with AGRIDEEP_CORS_ALLOWED_ORIGINS (comma-separated).
agrideep.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
